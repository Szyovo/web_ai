{% extends 'base.html' %}

{% block title %}删除确认 - AI大模型管理系统{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div>
        <a href="{% url 'ai_model_detail' model.pk %}" class="glass-button ripple text-white px-4 py-2 rounded-xl inline-flex items-center text-shadow font-medium">
            ← 返回详情
        </a>
    </div>

    <div class="glass-card rounded-2xl p-8">
        <div class="flex items-center mb-6">
            <div class="flex-shrink-0 glass-card rounded-full p-3" style="background: linear-gradient(135deg, rgba(239, 68, 68, 0.3), rgba(220, 38, 38, 0.3));">
                <svg class="h-8 w-8 text-red-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h1 class="ml-4 text-3xl font-bold text-white text-shadow-strong">⚠️ 确认删除</h1>
        </div>

        <div class="mb-6">
            <p class="text-white text-shadow font-bold mb-4 text-lg">您确定要删除以下模型吗？此操作无法撤销。</p>
            <div class="glass-card rounded-xl p-4 border-l-4 border-red-400">
                <dl class="space-y-3">
                    <div>
                        <dt class="text-sm font-bold text-white/80 text-shadow">🎯 模型名称</dt>
                        <dd class="mt-1 text-sm text-white font-bold text-shadow-strong">{{ model.name }}</dd>
                    </div>
                    <div>
                        <dt class="text-sm font-bold text-white/80 text-shadow">📌 版本号</dt>
                        <dd class="mt-1 text-sm text-white font-medium text-shadow">{{ model.version }}</dd>
                    </div>
                    <div>
                        <dt class="text-sm font-bold text-white/80 text-shadow">👤 开发者</dt>
                        <dd class="mt-1 text-sm text-white font-medium text-shadow">{{ model.developer }}</dd>
                    </div>
                </dl>
            </div>
        </div>

        <form method="post" class="flex space-x-4">
            {% csrf_token %}
            <button type="submit" class="glass-button ripple text-white px-8 py-3 rounded-xl font-bold text-shadow hover:scale-105 transition-transform" style="background: linear-gradient(135deg, rgba(239, 68, 68, 0.4), rgba(220, 38, 38, 0.4));">
                🗑️ 确认删除
            </button>
            <a href="{% url 'ai_model_detail' model.pk %}" class="glass-button ripple text-white px-8 py-3 rounded-xl font-bold text-shadow hover:scale-105 transition-transform" style="background: linear-gradient(135deg, rgba(107, 114, 128, 0.3), rgba(75, 85, 99, 0.3));">
                ❌ 取消
            </a>
        </form>
    </div>
</div>
{% endblock %}

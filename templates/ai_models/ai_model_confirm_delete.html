{% extends 'base.html' %}

{% block title %}删除确认 - AI大模型管理系统{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <a href="{% url 'ai_model_detail' model.pk %}" class="text-blue-600 hover:text-blue-800">
            ← 返回详情
        </a>
    </div>

    <div class="bg-white rounded-lg shadow-md p-8">
        <div class="flex items-center mb-6">
            <div class="flex-shrink-0 bg-red-100 rounded-full p-3">
                <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h1 class="ml-4 text-2xl font-bold text-gray-900">确认删除</h1>
        </div>

        <div class="mb-6">
            <p class="text-gray-700 mb-2">您确定要删除以下模型吗？此操作无法撤销。</p>
            <div class="bg-gray-50 p-4 rounded-lg mt-4">
                <dl class="space-y-2">
                    <div>
                        <dt class="text-sm font-medium text-gray-500">模型名称</dt>
                        <dd class="mt-1 text-sm text-gray-900 font-semibold">{{ model.name }}</dd>
                    </div>
                    <div>
                        <dt class="text-sm font-medium text-gray-500">版本号</dt>
                        <dd class="mt-1 text-sm text-gray-900">{{ model.version }}</dd>
                    </div>
                    <div>
                        <dt class="text-sm font-medium text-gray-500">开发者</dt>
                        <dd class="mt-1 text-sm text-gray-900">{{ model.developer }}</dd>
                    </div>
                </dl>
            </div>
        </div>

        <form method="post" class="flex space-x-4">
            {% csrf_token %}
            <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition font-medium">
                确认删除
            </button>
            <a href="{% url 'ai_model_detail' model.pk %}" class="bg-gray-500 text-white px-6 py-2 rounded-lg hover:bg-gray-600 transition font-medium">
                取消
            </a>
        </form>
    </div>
</div>
{% endblock %}
